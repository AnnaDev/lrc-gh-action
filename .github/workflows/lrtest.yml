name: LoadRunner Cloud Run Test Workflow
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      LRC_CLIENT_ID:
        description: Client id of LoadRunner Cloud
        required: true
      LRC_CLIENT_SECRET:
        description: Client secret of LoadRunner Cloud
        required: true
    outputs:
      lrc_run_id:
        description: Load test run id
        value: '${{ jobs.run_test.outputs.lrc_run_id }}'
jobs:
  run_test:
    name: Start a load test
    runs-on: ubuntu-latest
    outputs:
      lrc_run_id: '${{ steps.lrc_run_test.outputs.lrc_run_id }}'
    steps:
      - name: Run test in LoadRunner Cloud
        uses: MicroFocus/lrc-gh-action@v1
        id: lrc_run_test
        env:
          LRC_CLIENT_ID: '${{secrets.LRC_CLIENT_ID}}'
          LRC_CLIENT_SECRET: '${{secrets.LRC_CLIENT_SECRET}}'
        with:
          lrc_server: '${{secrets.LRC_SERVER}}'
          lrc_tenant: '${{secrets.LRC_TENANT_ID}}'
          lrc_project: '${{secrets.LRC_PROJECT_ID}}'
          lrc_test_id: '${{secrets.LRC_TEST_ID}}'
      - name: Print test run ID
        if: '${{ always() }}'
        run: 'echo "LRC Run ID is ${{ steps.lrc_run_test.outputs.lrc_run_id }}"'
        
      - name: Check test initialization and exit
        if: steps.lrc_run_test.outputs.lrc_run_id != ''
        run: |
          echo "::notice::Test started successfully!"
          echo "Test started successfully with Run ID: ${{ steps.lrc_run_test.outputs.lrc_run_id }}"
          echo "Workflow will exit now. Test execution continues in LoadRunner Cloud."
          exit 0
          
      - name: Handle test initialization failure
        if: steps.lrc_run_test.outputs.lrc_run_id == ''
        run: |
          echo "::error::Failed to start the test in LoadRunner Cloud"
          exit 1
